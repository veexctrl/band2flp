<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1166 880" role="img" aria-labelledby="title desc">
<title id="title">GarageBand reverse-engineering progress: about 50%</title>
<desc id="desc">Rough estimate of targeted format knowledge recovered, not a measure of converter completeness. Category weights express project priorities; category percentages are evidence-based judgments. The headline rounds the weighted estimate to the nearest 10%.</desc>
<defs><linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#4de0bd"/><stop offset="1" stop-color="#61b9ff"/></linearGradient></defs>
<rect width="1166" height="880" rx="26" fill="#101826"/>
<text x="76" y="74" class="eyebrow">BAND2FLP · RESEARCH SNAPSHOT · 2026-10-07</text>
<text x="76" y="132" class="headline">GarageBand reverse engineering</text>
<text x="76" y="190" class="subhead">Evidence recovered across the targeted project format</text>
<rect x="922" y="54" width="168" height="116" rx="18" fill="#1b2c3e" stroke="#31506a"/>
<text x="1006" y="111" class="big-pct" text-anchor="middle">~50%</text>
<text x="1006" y="143" class="small" text-anchor="middle">estimated coverage</text>
<text x="76" y="218" class="row-title">Package and summary metadata</text><text x="1090" y="218" class="row-pct" text-anchor="end">~85%</text><rect x="76" y="231" width="1014" height="8" rx="4" class="bar-bg"/><rect x="76" y="231" width="861.9" height="8" rx="4" class="bar-fill"/><text x="76" y="261" class="row-note">ZIP inventory and plist summary fields are parsed; metadata authority and cross-version differences remain open.</text><text x="76" y="284" class="row-title">Logic payload framing and event inventory</text><text x="1090" y="284" class="row-pct" text-anchor="end">~75%</text><rect x="76" y="297" width="1014" height="8" rx="4" class="bar-bg"/><rect x="76" y="297" width="760.5" height="8" rx="4" class="bar-fill"/><text x="76" y="327" class="row-note">Chunk and event boundaries parse; IDA confirmed 68 F1 event ranges and 204 group fields across two projects. F1 semantics remain unknown.</text><text x="76" y="350" class="row-title">Audio references and placement starts</text><text x="1090" y="350" class="row-pct" text-anchor="end">~68%</text><rect x="76" y="363" width="1014" height="8" rx="4" class="bar-bg"/><rect x="76" y="363" width="689.5" height="8" rx="4" class="bar-fill"/><text x="76" y="393" class="row-note">Starts and links recovered. TRK-015 supports relative order across six rows in one fixture; absolute indices, loop-cell role, and duration remain unknown.</text><text x="76" y="416" class="row-title">Region lengths, trims, loops, and offsets</text><text x="1090" y="416" class="row-pct" text-anchor="end">~15%</text><rect x="76" y="429" width="1014" height="8" rx="4" class="bar-bg"/><rect x="76" y="429" width="152.1" height="8" rx="4" class="bar-fill"/><text x="76" y="459" class="row-note">AuRg source-window candidates agree with embedded frames and two external groups; timeline duration, repeats, and stretch remain unknown.</text><text x="76" y="482" class="row-title">MIDI placement and note semantics</text><text x="1090" y="482" class="row-pct" text-anchor="end">~34%</text><rect x="76" y="495" width="1014" height="8" rx="4" class="bar-bg"/><rect x="76" y="495" width="344.8" height="8" rx="4" class="bar-fill"/><text x="76" y="525" class="row-note">Editable FL25 previews; five MIDI regions now retain four candidate track bindings. Note fields, fine timing and track semantics remain open.</text><text x="76" y="548" class="row-title">Tempo and meter timeline</text><text x="1090" y="548" class="row-pct" text-anchor="end">~40%</text><rect x="76" y="561" width="1014" height="8" rx="4" class="bar-bg"/><rect x="76" y="561" width="405.6" height="8" rx="4" class="bar-fill"/><text x="76" y="591" class="row-note">Summary and unique group-zero tempo/meter candidates agree in two projects; position units, change maps, and completeness remain unresolved.</text><text x="76" y="614" class="row-title">Tracks, mixer, sections, and automation</text><text x="1090" y="614" class="row-pct" text-anchor="end">~22%</text><rect x="76" y="627" width="1014" height="8" rx="4" class="bar-bg"/><rect x="76" y="627" width="223.1" height="8" rx="4" class="bar-fill"/><text x="76" y="657" class="row-note">Trak links and ordinal agreement support provisional MIDI bindings; identity, names, mixer state and automation remain unresolved.</text>
<line x1="76" y1="706" x2="1090" y2="706" stroke="#2b3a4b"/>
<text x="76" y="748" class="section">MILESTONES</text>
<line x1="76" y1="786" x2="1090" y2="786" stroke="#35465b" stroke-width="2"/>
<circle cx="76.0" cy="786" r="8" fill="#52d6a0"/><text x="76.0" y="816" class="milestone-name" text-anchor="middle">Package and metadata parser</text><text x="76.0" y="838" class="milestone-state" text-anchor="middle" fill="#52d6a0">DONE</text><circle cx="329.5" cy="786" r="8" fill="#58c9f5"/><text x="329.5" y="816" class="milestone-name" text-anchor="middle">Audio source and start recovery</text><text x="329.5" y="838" class="milestone-state" text-anchor="middle" fill="#58c9f5">ROW ORDER · INDEX OPEN</text><circle cx="583.0" cy="786" r="8" fill="#a994ff"/><text x="583.0" y="816" class="milestone-name" text-anchor="middle">MIDI interpretation</text><text x="583.0" y="838" class="milestone-state" text-anchor="middle" fill="#a994ff">EDITABLE MIDI + TRACK CANDIDATES</text><circle cx="836.5" cy="786" r="8" fill="#58c9f5"/><text x="836.5" y="816" class="milestone-name" text-anchor="middle">Region boundaries and track state</text><text x="836.5" y="838" class="milestone-state" text-anchor="middle" fill="#58c9f5">REGION LINK CANDIDATE</text><circle cx="1090.0" cy="786" r="8" fill="#58c9f5"/><text x="1090.0" y="816" class="milestone-name" text-anchor="middle">FL Studio audio clip loading</text><text x="1090.0" y="838" class="milestone-state" text-anchor="middle" fill="#58c9f5">SOURCE MATCH + WAV</text>
<text x="76" y="868" class="footer">Heuristic estimate · See docs/progress.json and reverse-engineering notes for evidence and unknowns.</text>
