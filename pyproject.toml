[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "band2flp"
version = "0.1.0"
description = "Research tools for inspecting GarageBand projects and converting them to FL Studio"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
band2flp = "band2flp.cli:main"

[tool.setuptools]
packages = ["band2flp"]
